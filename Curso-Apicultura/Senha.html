<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Acesso — Apicultura</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #FF7A00, #FFB347); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .caixa { background: white; border-radius: 16px; padding: 2.5rem; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        h2 { color: #FF7A00; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 1rem; border: 2px solid #eee; border-radius: 10px; font-size: 1rem; margin-bottom: 1rem; }
        button { width: 100%; padding: 1rem; background: #FF7A00; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #e66a00; }
        .erro { color: red; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
<div class="caixa">
    <h2>🔒 Área Protegida</h2>
    <p>Digite a senha para acessar o curso</p>
    <input type="password" id="senhaDigitada" placeholder="Digite a senha...">
    <button onclick="verificarSenha()">Acessar Curso</button>
    <p class="erro" id="msgErro">Senha incorreta! Tente novamente.</p>
</div>

<script>
const senhaCorreta = 'Apicultura2026!';
const chaveArmazenamento = 'acesso_apicultura';

// Já tem acesso? Entra direto!
if (localStorage.getItem(chaveArmazenamento) === 'liberado') {
    window.location.href = 'curso.html';
}

function verificarSenha() {
    const digitada = document.getElementById('senhaDigitada').value;
    if (digitada === senhaCorreta) {
        localStorage.setItem(chaveArmazenamento, 'liberado');
        window.location.href = 'curso.html';
    } else {
        document.getElementById('msgErro').style.display = 'block';
    }
}
</script>
</body>
</html>
