<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar | DS Cursos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
:root{--l:#FF7A00;--v:#2E7D32;--e:#1A1A1A;--vermelho:#d32f2f;--azul:#0066CC;}
body{background:linear-gradient(135deg,var(--l),#ff9800);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.caixa{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 8px 32px rgba(0,0,0,.2);width:100%;max-width:420px;}
.caixa h1{text-align:center;color:var(--e);margin-bottom:.5rem;font-size:1.6rem;}
.caixa p{text-align:center;color:#666;margin-bottom:2rem;}
.grupo{margin-bottom:1.2rem;}
.grupo label{display:block;margin-bottom:.5rem;font-weight:bold;color:#333;}
.grupo input{width:100%;padding:.9rem;border:2px solid #ddd;border-radius:8px;font-size:1rem;}
.grupo input:focus{border-color:var(--l);outline:none;}
.botao{width:100%;padding:1rem;border:none;border-radius:8px;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:.3s;}
.botao-principal{background:var(--v);color:#fff;margin-top:.5rem;}
.botao-principal:hover{background:#266d2b;}
.botao-secundario{background:transparent;color:var(--azul);border:2px solid var(--azul);margin-top:.8rem;}
.botao-secundario:hover{background:#e3f2fd;}
.aviso{padding:.8rem;border-radius:6px;margin:1rem 0;display:none;}
.erro{background:#ffebee;color:var(--vermelho);}
.sucesso{background:#e8f5e9;color:var(--v);}
.rodape{text-align:center;margin-top:1.5rem;color:#888;font-size:.9rem;}
</style>
</head>
<body>
<div class="caixa">
<h1>📝 Criar Conta</h1>
<p>Faça seu cadastro para acessar os cursos</p>

<div class="aviso erro" id="avisoErro"></div>
<div class="aviso sucesso" id="avisoSucesso"></div>

<div class="grupo">
<label for="nome">Nome Completo</label>
<input type="text" id="nome" placeholder="Seu nome">
</div>

<div class="grupo">
<label for="email">E-mail</label>
<input type="email" id="email" placeholder="seuemail@exemplo.com">
</div>

<div class="grupo">
<label for="senha">Senha</label>
<input type="password" id="senha" placeholder="Crie uma senha">
</div>

<div class="grupo">
<label for="confirma">Repetir Senha</label>
<input type="password" id="confirma" placeholder="Digite a senha novamente">
</div>

<button class="botao botao-principal" onclick="cadastrar()">Criar Minha Conta</button>

<button class="botao botao-secundario" onclick="window.location.href='login.html'">Já tenho conta → Entrar</button>

<div class="rodape">
<a href="index.html" style="color:#888;">← Voltar para a página inicial</a>
</div>
</div>

<script>
const CHAVE = 'dscursos_2026_seguro';

function cadastrar(){
const nome = document.getElementById('nome').value.trim();
const email = document.getElementById('email').value.trim();
const senha = document.getElementById('senha').value;
const confirma = document.getElementById('confirma').value;
const avisoErro = document.getElementById('avisoErro');
const avisoSucesso = document.getElementById('avisoSucesso');

avisoErro.style.display = 'none';
avisoSucesso.style.display = 'none';

if(!nome || !email || !senha || !confirma){
avisoErro.textContent = 'Preencha todos os campos!';
avisoErro.style.display = 'block';
return;
}

if(senha !== confirma){
avisoErro.textContent = 'As senhas não coincidem!';
avisoErro.style.display = 'block';
return;
}

if(senha.length < 4){
avisoErro.textContent = 'A senha deve ter pelo menos 4 caracteres!';
avisoErro.style.display = 'block';
return;
}

let dados = JSON.parse(localStorage.getItem(CHAVE) || '{"alunos":[]}');

if(dados.alunos.some(a=>a.email === email)){
avisoErro.textContent = 'Este e-mail já está cadastrado!';
avisoErro.style.display = 'block';
return;
}

dados.alunos.push({
nome: nome,
email: email,
senha: btoa(senha),
cursos: [],
aparelhos: []
});

localStorage.setItem(CHAVE, JSON.stringify(dados));

avisoSucesso.textContent = '✅ Cadastro feito com sucesso! Redirecionando...';
avisoSucesso.style.display = 'block';

setTimeout(()=>{window.location.href='login.html';}, 1500);
}
</script>
</body>
</html>
