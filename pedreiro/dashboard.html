),t.ref!==void 0&&(i=t.ref);for(r in t)h0.call(t,r)&&!A0.hasOwnProperty(r)&&(l[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:v0,type:e,key:o,ref:i,props:l,_owner:y0.current}}var N=zc,F=zc;var g0=[{id:"M1",short:"Ferramentas",lessons:[{title:"Aula 1: Kit essencial que separa profissional de improvisado",content:"Colher de pedreiro 10'' com cabo anatômico, prumo de face, nível 60cm alumínio fundido, linha de pedreiro trançada, esquadro metálico 50cm, trena 8m com trava, desempenadeira de aço e PVC, marreta 1kg, talhadeira. O erro do iniciante é comprar kit barato que empena. Prumo precisa ter centro calibrado: teste pendurando 2m e verificando se a ponta não oscila mais que 1mm. Nível: confira bolha invertendo 180° no mesmo ponto; se variar, descarte. Mantenha colher sempre limpa com esponja úmida, nunca bata para tirar argamassa seca — isso desalinha a lâmina. Estojo rígido para níveis, nada de jogar na caçamba."},{title:"Aula 2: Betoneira, serra mármore e segurança NR-18",content:"Betoneira 150L: antes de ligar, confira óleo, correia e trava do volante. Ordem de carga correta: 50% da água, 50% brita, cimento total, restante brita, restante água — isso evita pelotas. Tempo de mistura 3 minutos, não mais. Serra mármore 1450W: use disco diamantado segmentado para concreto e contínuo para porcelanato. Sempre corte com água ou exaustão, óculos fechado, protetor auricular e luva anti-corte. Extensão elétrica precisa ser 2,5mm² no mínimo para 20m. Na obra, isole quadro com DR 30mA. Ferramenta elétrica nunca em piso molhado sem IP67. Organize cavaletes com altura 90cm para corte ergonômico e reduza LER."},{title:"Aula 3: Afiação, calibração e produtividade diária",content:"Desempenadeira de aço com borda amassada deixa risco no reboco fino. Lixe borda a cada 2 dias com lixa 220. Lápis de carpinteiro afiado em bisel largo, não ponta fina. Mangueira de nível cristal 5/16'' sem bolhas: encha por gravidade, deixe água correr 2min, vede com dedo e confira nível em 10m — diferença zero. Marcação de ferramenta: pinte cabos de laranja para não sumir. Checklist matinal de 3 minutos: nível calibrado? prumo sem amasso? 2 linhas reservas? discos com borda >80%? Essa rotina elimina 40 minutos de retrabalho por dia e passa impressão de mestre, não de ajudante."}]},{id:"M2",short:"Gabarito",lessons:[{title:"Aula 1: Esquadro 3-4-5 na prática sem teodolito",content:"Gabarito em tábua de pinus 15cm, pontalete 3x3'' a cada 1,5m, cravado 60cm. Nivelamento da tábua superior com nível a laser ou mangueira: diferença máxima 3mm em 30m. Marque eixo da parede com prego 18x27. Para esquadrejar, estique 3m num lado, 4m no outro, a hipotenusa deve dar 5m cravado. Se der 5,01m, está 1cm fora em 4m — em 10m vira 2,5cm de parede torta. Repita em todos os cantos. Use linha de nylon 0,80mm, não barbante que estica. Conferência final cruzada: meça diagonais do gabarito total, precisam ser iguais. Só então autorize escavação."},{title:"Aula 2: Nível de mangueira e transferência de RN",content:"Referência de nível (RN) deve estar fora da obra, em muro vizinho ou estaca de concreto. Com mangueira de 15m cheia sem bolhas, um ajudante segura na RN, outro transfere para gabarito. Marque com traço fino e prego. Não sopre na mangueira, não deixa bolha. Se trabalhar sozinho, use nível a laser de linha, mas confirme com mangueira a cada 5m. Cota de baldrame: +20cm acima da rua para evitar alagamento. Anote todas as cotas em caderno plastificado. Erro comum: considerar terreno plano. Sempre faça levantamento com nível em malha 2x2m antes do gabarito para calcular corte/aterro e evitar baldrame com altura variada."},{title:"Aula 3: Locação de eixos e conferência de medidas",content:"Após gabarito nivelado e esquadrejado, estique linhas dos eixos principais. Marque com trena metálica, nunca fita. Largura da vala: bloco 14cm + 5cm cada lado para trabalho = 24cm. Use cal para riscar solo. Confira esquadro de cada cômodo com 60-80-100cm (variação do 3-4-5) antes de escavar. Tensão da linha: média, se esticar demais afasta pontalete. Deixe gabarito 1m afastado da vala para não cair terra. Fotografe com trena aparente para cliente — documentação vale mais que palavra. Gabarito bem feito economiza 3 sacos de cimento em regularização de baldrame torto."}]},{id:"M3",short:"Fundação",lessons:[{title:"Aula 1: Baldrame, broca e impermeabilização negativa",content:"Baldrame 20x30 para muro e 25x35 para casa térrea, concreto FCK 25MPa, traço 1:2:3 (cimento, areia média, brita 1) com 160L água por saco para slump 8cm. Broca 25cm diâmetro, 3m profundidade mínima até solo firme, 4 ferros 10mm estribo 5mm a cada 15cm. Sapata corrida? Apiloe fundo com soquete 10kg. Impermeabilização: 3 demãos de emulsão asfáltica na lateral + filme PEAD 200 micras no fundo antes do concreto. Cuidado: nunca jogue concreto com terra desbarrancada, isso cria broca fria. Nível superior do baldrame sarrafeado na régua e desempenado leve. Cura úmida 3 dias com lona."},{title:"Aula 2: Arranque, nivelamento e passagem hidráulica",content:"Arranque dos pilares: deixe 60cm de espera dobrada, gancho 10cm na ponta. Use gabarito de madeira furado para manter 4 ferros no esquadro durante concretagem. Nível do baldrame deve ser único em toda casa, diferença máxima 5mm. Antes de concretar, posicione passagens de esgoto 100mm com declividade 1% já envoltas em manta para não ter que quebrar depois. Cuidado com eletroduto: use 2 curvas longas 90°, nunca curva curta que estrangula cabo. Vibração do concreto com haste 25mm, sem encostar na ferragem. Se não tiver vibrador, socate com barra 12mm 15 vezes por metro. Desforma lateral em 24h, topo em 48h."},{title:"Aula 3: Reaterro compactado e controle de umidade",content:"Reaterro só após 7 dias de cura do baldrame. Solo em camadas 20cm, umedecido e apiloado com soquete manual ou placa 60kg. Nunca reaterre com entulho — gera recalque e fissura no piso. Compactação alvo 95% Proctor, teste simples: ao pisar forte, não deixar marca >5mm. Entre baldrame e alvenaria, faça 2 fiadas de bloco canaleta com graute e 2 ferros 8mm, depois 2 demãos de Vedatop flexível com tela poliéster no encontro. Isso corta umidade ascendente que mancha pintura em 6 meses. Altura final do piso interno = baldrame + 8cm contrapiso + 1,5cm revestimento. Deixe marcado no pilar."}]},{id:"M4",short:"Alvenaria",lessons:[{title:"Aula 1: Primeira fiada mestra e prumo que não mente",content:"Primeira fiada define a obra. Argamassa de assentamento traço 1:2:8 (cimento, cal CH-III, areia média lavada) — cal dá plasticidade e evita retração. Espalhe farofa com 5mm além do bloco, não no chão. Escantilhão de madeira com marcas a cada 20cm (bloco + junta 1cm). Estique linha pelos cantos já prumados. Prumo de face a cada 3 blocos: afaste 2mm da parede para ver luz. Nível de bolha no topo do bloco, nunca na lateral torta. Junta vertical amarração 10cm mínimo, nunca junta sobre junta. Canto em L: intercale blocos, não encoste dois topos. Se prumo sair 3mm em 2m, desmanche — reboco não corrige, só disfarça e estoura."},{title:"Aula 2: Argamassa, junta de 1cm e produtividade",content:"Traço 1:2:8 rende 0,8m² por masseira de 20L. Água: 1,2L por kg cimento, ajuste até massa ficar em pé na colher sem escorrer. Temperatura >30°C? Use areia úmida e cubra blocos com lona para não sugar água rápido. Junta horizontal 1cm constante controlada por gabarito de ferro 10mm: apoie ferro, assente bloco, retire ferro. Junta vertical também 1cm. Excesso de argamassa deve sair para dentro e fora igualmente, depois corte com colher. Canteiro limpo: masseira sempre sobre lona, nada de fazer massa no chão que contamina com terra. Um pedreiro profissional assenta 12m²/dia com junta perfeita; amador faz 20m² torto e perde 2 dias no reboco."},{title:"Aula 3: Amarração, andaime e vão de porta/janela",content:"Paredes em T: a cada 2 fiadas, entre com bloco atravessando 15cm. Para vão de porta, já deixe 5mm de folga cada lado + 2cm em cima para cunha. Não assente batente direto no bloco, deixe vão livre e fixe depois com espuma expansiva + parafuso. Altura de peitoril 1,10m em janela, confira nível entre janelas da mesma fachada com laser. Andaime 1,5m largura, tábua 30mm sem nó, guarda-corpo. Ao subir parede acima de 2m, verifique prumo externo com prumo de 3m ou nível laser. Deixe esperas elétricas a cada 1,2m com caixinha 4x2 já chumbada na fiada, prumada e com conduíte já passado."}]},{id:"M5",short:"Vergas",lessons:[{title:"Aula 1: Verga e contraverga dimensionadas",content:"Verga mínimo H=10cm para vão até 1,2m, 15cm para até 2m. Largura = parede + acabamento. Ferragem: 2 ferros 8mm embaixo e 2 em cima para vão >1,5m, estribo 4,2mm a cada 15cm. Transpasse 30cm mínimo para cada lado além do vão, ou 20% do vão, o que for maior. Nunca apoie verga só 10cm — trinca em 45° na quina. Concreto FCK 20MPa, vibre leve. Contraverga igual, abaixo da janela, para segurar fissura de canto. Forma com 2 tábuas laterais e fundo, desforma em 7 dias. Se for bloco canaleta, use canaleta J ou U com fundo de madeira, concreto dentro. Erro fatal: fazer verga só com massa forte, sem ferro."},{title:"Aula 2: Execução sem escoramento falho",content:"Escoramento com pontalete 3x3'' e cunha dupla, nunca tijolo. Altura da verga marcada no escantilhão. Nível superior da verga na mesma cota para todas janelas da fachada. Ao concretar, não jogue concreto de cima >1m, segrega. Cura 3 dias molhando. Para vão de garagem 3m, verga vira viga: 12x30 com 4 ferros 10mm e estribo 5mm a cada 10cm nos apoios. Nesse caso exige cálculo de engenheiro, mas execução técnica é a mesma: transpasse 40cm, não economize ferro. Deixe 2cm cobrimento com espaçador plástico. Foto antes de concretar para comprovar ferragem ao cliente."},{title:"Aula 3: Fissuras e reforço em vão existente",content:"Fissura diagonal em janela = verga curta ou ausente. Recuperação: corte 40cm além da fissura cada lado, instale verga pré-moldada 10x10 com graute, transpasse 30cm com chumbamento químico. Se não puder quebrar, instale 2 barras 6,3mm com argamassa polimérica em rasgo horizontal acima do vão, 50cm além da trinca. Selar fissura com tela de poliéster + argamassa flexível. Ensaio prático: após cura, bata com martelo — som oco indica vazio. Profissional explica ao cliente por que verga custa R$ 40 mas evita R$ 800 de retrabalho com gesso e pintura trincada."}]},{id:"M6",short:"Chapisco",lessons:[{title:"Aula 1: Traço 1:3 com bianco que agarra",content:"Chapisco traço 1:3 (cimento: areia grossa lavada) + aditivo PVA 10% da água para fachada e teto. Consistência fluida, jogado com colher ou rolo textura, não desempenado. Espessura 3-5mm, cobrir 90% do bloco, sem deixar careca. Cura: molhar bloco antes, senão bloco suga água e chapisco vira pó. Em concreto liso, chapisco rolado com areia grossa + bianco puro, textura áspera que ancora emboço. Tempo aberto: aplique emboço após 24h, não no mesmo dia. Rendimento: 1 saco faz 12m². Em área molhada, adicione impermeabilizante na água. Som do chapisco bom: estalo seco ao bater, não som oco."},{title:"Aula 2: Chapisco em estrutura e teto sem cair",content:"Pilar e viga lisos: lixe com escova de aço, aplique chapisco com colher em movimento de chicote, força no punho. No teto, use consistência mais seca e jogue de baixo para cima, lona no chão. Se cair muito, é excesso de água. Proteção: óculos fechado, pois respinga cimento nos olhos. Temperatura ideal 15-28°C, vento forte resseca e solta. Em bloco celular, chapisco com argamassa colante AC-III fina, não tradicional que desplaca. Checagem: após 6h, risque com unha — não pode esfarelar. Se esfarelar, traço fraco ou cura ausente."},{title:"Aula 3: Erros que fazem emboço desplacar",content:"Desplacamento 90% por chapisco mal feito ou pó no bloco. Antes, varra parede e molhe 2h antes. Nunca chapiscar sobre poeira, óleo desmoldante ou bloco encharcado pingando. Espessura >8mm vira casca e cai. Juntas de dilatação: respeite a cada 3m em fachada com perfil. Chapisco em dia de chuva? Cubra parede com lona, água de chuva lava cimento. Teste de arrancamento simples: cole fita crepe forte e puxe — se sair chapisco, refaça. Um chapisco bem feito sustenta 20 anos de reboco sem oco."}]},{id:"M7",short:"Emboço",lessons:[{title:"Aula 1: Taliscas, mestras e sarrafeamento perfeito",content:"Emboço traço 1:2:8 + 100ml impermeabilizante por saco para área externa. Taliscas 2x2cm argamassa, prumadas com prumo laser, espaçamento 1,5m. Deixe secar 2h. Mestras: ligue taliscas verticalmente com régua 2m, sarrafeie. Plano verificado com régua 2,5m na diagonal — luz máxima 2mm. Espessura 15-25mm, se parede torta 4cm, faça em 2 camadas 2cm com 48h intervalo e chapisco entre camadas. Sarrafeamento: régua de alumínio apoiada nas mestras, movimento vai e vem curto, não pressione. Após sarrafeado, não desempenar, deixe áspero para reboco. Cura úmida 2 dias."},{title:"Aula 2: Esquadro, prumo e nível que cliente mede",content:"Cliente mede prumo com nível de celular, então faça certo. Prumo laser em 2 direções. Esquadro de canto com régua 60cm, erro <1mm. Vãos: confira diagonais, diferença <3mm. Nível superior de emboço em cozinha precisa estar no mesmo plano para azulejo não escada. Use linha de pedreiro nas mestras superiores. Para fachada, use prumo de 4m ou nível laser rotativo. Corte de aresta: cantoneira 2m prumada com argamassa. Tempo de puxada: espere emboço firmar 30min, depois passe régua novamente — isso elimina barriga."},{title:"Aula 3: Emboço para receber cerâmica sem dor",content:"Para receber azulejo, emboço deve ficar sarrafeado, não desempenado, para argamassa colar. Planeza com régua 2m: folga máxima 3mm. Em área molhada, emboço com 2% caimento para ralo já executado? Não, caimento é no contrapiso, mas emboço precisa estar prumado. Deixe cura 7 dias antes de assentar cerâmica. Se chover, cubra. Junta de movimentação a cada 3m vertical e horizontal com selante PU. Emboço bem feito reduz consumo de argamassa colante de 8kg/m² para 4kg/m² e evita dente entre peças."}]},{id:"M8",short:"Reboco",lessons:[{title:"Aula 1: Massa fina, desempeno e feltro sem marca",content:"Reboco Paulista: traço 1:2:6 (cimento, cal fina, areia fina peneirada 0,6mm). Espessura 5mm máximo sobre emboço seco há 7 dias e umedecido. Aplique com desempenadeira de aço em camada fina, depois PVC em movimentos circulares leves. Segredo: não deixe secar demais antes de desempenar — ponto é quando brilha mas não gruda no dedo. Feltro: esponja levemente úmida, movimentos 8, sem pressionar. Temperatura alta: trabalhe de manhã. Cada parede em etapa única, sem emenda no meio, senão marca. Rendimento 25m² por saco."},{title:"Aula 2: Quinas vivas, arestas e iluminação rasante",content:"Quina viva faz diferença de mestre. Use desempenadeira de quina ou régua metálica 1,5m como guia. Luz rasante lateral revela ondulação: acenda lanterna encostada na parede. Onde houver sombra, retome com massa fina antes de secar total. Teto: reboco 3mm máximo para não pesar, desempeno cruzado. Evite areia grossa que risca. Peneire areia em peneira 2mm. Canto teto-parede: passe desempenadeira pequena 90°. Pintura só após 28 dias de cura ou use seladora com pH. Se cliente usar LED embutido, avise que qualquer onda aparece — capriche."},{title:"Aula 3: Fissura, retração e cura que evita mapa",content:"Fissura mapa = excesso cimento, areia fina demais ou cura rápida ao sol. Adicione cal, ela segura água e dá elasticidade. Cura: após desempeno, 2 dias molhando leve com broxa. Nunca reboco em parede quente >35°C. Junta de dilatação estrutural: respeite, não reboco por cima. Trinca fina após secagem: abra em V 3mm, preencha com selante acrílico + tela. Textura final lisa acetinada, sem areia aparente. Toque: mão desliza sem arranhar. Isso valoriza pintura e cliente paga 30% a mais por acabamento premium."}]},{id:"M9",short:"Contrapiso",lessons:[{title:"Aula 1: Taliscas, caimento 1% e compactação",content:"Contrapiso traço 1:4 (cimento: areia média) farofa úmida, não mole. Taliscas com mesmo traço, altura definida por nível laser: marca na parede 1m do piso acabado, transfira. Caimento em box e varanda 1% (1cm por metro) para ralo, em sala 0,5%. Verificação: jogue 2L água, deve escoar sem poça. Espessura mínima 3cm, ideal 5cm, se >7cm faça em 2 camadas. Compacte com soquete 5kg ou régua batida. Sarrafeie e desempeno grosso de madeira, não fino que fecha poros. Junta a cada 3m com ripa 1cm, depois selante. Cura 3 dias coberta."},{title:"Aula 2: Nível zero, soleira e porta sem degrau",content:"Nível zero da casa: soleira da porta principal. Todas as taliscas saem dela. Use mangueira ou laser rotativo. Erro comum: banheiro mais alto que sala — água invade. Banheiro deve ficar 2cm abaixo. Porta: deixe vão com folga 1,5cm em cima do contrapiso para assentamento de piso. Soleira de granito com 2cm de penetração na porta, caimento para fora. Antes de concretar, confira passagem de esgoto e elétrica sob contrapiso com caimento certo. Foto do nível a laser para cliente ver precisão."},{title:"Aula 3: Cura, fissura e preparação para porcelanato",content:"Contrapiso fissura se secar rápido. Molhe 2x ao dia 4 dias. Planeza com régua 2m, folga máxima 3mm para porcelanato grande formato 90x90, senão peça oca. Teste de som oco com cabo de vassoura. Se oco >20% área, refaça. Limpeza: varra e aspire antes de assentar piso. Imprima com argamassa colante líquida? Não, apenas umedeça. Contrapiso bem feito economiza 3mm argamassa colante e evita estalo futuro. Entregue com risco de nível escrito na parede com data — profissionalismo que gera indicação."}]},{id:"M10",short:"Azulejo",lessons:[{title:"Aula 1: Paginação, prumo e dupla colagem",content:"Paginação desenhada no chão antes. Comece pelo centro da parede mais visível, recorte nas quinas menos visíveis, nunca 2cm fatia fina no canto principal — divida meio a meio. Linha de prumo laser vertical a cada 60cm. Argamassa AC-III para porcelanato, dupla colagem em peça >60cm: passe no emboço e no verso da peça com lado dentado 8mm, 100% cobertura. Bate com martelo de borracha branca, não preto que mancha. Espaçador 2mm interno, 3mm externo. Corte com riscadeira 800mm ou serra úmida diamantada. Nivelador tipo cunha para porcelanato 80x80, evita dente >0,5mm."},{title:"Aula 2: Esquadro de parede, nicho e meia-esquadria",content:"Canto em meia-esquadria 45° com disco contínuo diamantado e lixa 400 para acabamento, sem cantoneira plástica que amarela. Nicho: impermeabilize antes com membrana acrílica 2 demãos + tela. Caimento da base do nicho 1% para fora para não acumular água. Altura padrão nicho 30cm base a 90cm do piso. Furo para ducha: serra copo diamantada 32mm com água, nunca trincar com prego. Assente fileira completa, confira prumo a cada peça com nível 60cm. Limpe argamassa da junta na hora, depois vira pedra."},{title:"Aula 3: Ralo, arremate e junta que não trinca",content:"Ralo: peça cortada em 4 com junta alinhada ao ralo quadrado, ou ralo linear para porcelanato grande. Deixe junta de movimentação perimetral 5mm escondida por rodapé. Junta de assentamento limpa 2/3 profundidade para receber rejunte. Após 24h, faça teste de percussão: som oco = vazia, troque. Rejunte só após 48h, emboço curado. Limpeza final com esponja úmida diagonal, não lave com ácido. Entrega: luvas brancas, pano microfibra, mostra brilho sem resto. Cliente vê capricho e paga bônus."}]},{id:"M11",short:"Piso",lessons:[{title:"Aula 1: Porcelanato grande formato sem oco",content:"Piso 90x90 exige contrapiso plano 3mm em 2m, argamassa AC-III flexível dupla colagem, desempenadeira 10mm. Comece pelo canto mais longo visível da porta, linha mestra esticada. Aplique argamassa em área 2 peças por vez para não formar película. Assente, bata com martelo borracha e nível 1,2m nas duas direções. Espaçador cunha + nivelador, remove após 12h. Junta mínima 2mm retificado, 3mm natural. Corte em serra bancada com água para não lascar borda. Caimento varanda 1% constante medido com nível digital."},{title:"Aula 2: Esquadro, paginação e soleira sem degrau",content:"Paginação em L: risco com linha giz azul. Esquadro da sala com 3-4-5, diferença diagonal <5mm em 6m. Soleira: pedra com 2cm avanço, topo alinhado ao piso mais alto, junta seca 1mm. Porta de correr: trilho embutido nivelado antes. Junta de dilatação a cada 6m em área interna e 3m externa, perfil alumínio ou PU. Proteção: após assentar, cubra com papelão ondulado 48h, nada de trânsito. Teste de empeno: régua 2m sobre 3 peças, folga <1mm."},{title:"Aula 3: Rodapé, acabamento e entrega sem risco",content:"Rodapé 10cm corte reto, argamassa no verso 100%, espaçador 2mm alinhado com junta piso. Canto 45° com lixa fina. Rejunte piso após 24h. Limpeza final com removedor de argamassa neutro, não ácido muriático que corrói rejunte. Rodapé encostado sem fresta: parede precisa estar rebocada plana. Se houver fresta >2mm, use selante pintável cor parede. Check final: luz rasante, dente, oco, caimento com água. Entrega com planta de paginação e sobra 10% peças etiquetadas."}]},{id:"M12",short:"Rejunte",lessons:[{title:"Aula 1: Rejunte epóxi vs acrílico e cor que valoriza",content:"Rejunte acrílico para área seca, epóxi para box, cozinha e fachada molhada. Junta mínima 2mm para epóxi fluir. Largura da junta: 2-3mm interno, 5mm externo. Cor: cinza platina para porcelanato cinza, não branco que encarde. Mistura epóxi: resina + catalisador proporção 10:1, misture 3min lento para não criar bolha, use em 45min. Aplique com espátula de borracha dura em diagonal, force preencher 2/3 profundidade. Limpeza inicial após 20min com esponja úmida, final após 12h com removedor epóxi. EPI: luva nitrílica, vapor irrita."},{title:"Aula 2: Aplicação sem manchar porcelanato",content:"Porcelanato polido mancha com rejunte se não limpar rápido. Proteja com cera temporária? Não, apenas limpe em 15min. Junta deve estar seca, sem pó, sem argamassa colante alta. Umedeça levemente com esponja para epóxi aderir melhor. Aplique em área 2m², já limpe excesso com esponja úmida em movimento circular, enxágue a cada passada. Não deixe película leitosa secar >2h, vira cimento. Segunda limpeza com pano seco microfibra. Em junta larga >5mm, use rejunte com areia quartzosa."},{title:"Aula 3: Dilatação, selante e manutenção que evita mofo",content:"Junta de movimentação não recebe rejunte rígido, recebe selante PU ou silicone acético antimofo. Perímetro de box, encontro piso-parede, ralo. Corte bico 45°, aplique com pistola, alise com dedo + detergente neutro. Mofo em rejunte: falta ventilação e rejunte poroso. Epóxi resolve, é impermeável e não mofa. Oriente cliente: limpeza semanal com detergente neutro, nunca água sanitária pura que desbota. Garantia escrita 1 ano contra desplacamento se limpeza for correta. Isso fecha serviço premium."}]},{id:"M13",short:"Impermeabilização",lessons:[{title:"Aula 1: Baldrame, banheiro e laje com membrana",content:"Baldrame: emulsão asfáltica 3 demãos cruzadas + manta PEAD. Banheiro: membrana acrílica flexível 4 demãos com tela poliéster nos cantos e ralos, subindo 30cm na parede e 10cm no box todo. Teste de estanqueidade 72h com água 5cm. Laje exposta: regularize caimento 1% para ralo, membrana acrílica 6 demãos + tela 100% + proteção mecânica 2cm argamassa 1:4 com junta. Ralo: reforço com tela extra 20x20cm. Não fure membrana depois com parafuso — use chumbador químico lateral."},{title:"Aula 2: Caixa d'água, muro e infiltração ascendente",content:"Caixa d'água: membrana cimentícia bicomponente 3 demãos internas, cura úmida 3 dias. Muro de divisa: chapisco com aditivo impermeabilizante + emboço com Vedatop + pintura acrílica emborrachada. Infiltração ascendente: corte até 1m altura, aplique argamassa polimérica com 3 demãos, reboque com aditivo. Dreno em muro arrimo: tubo 50mm a cada 2m + brita + manta bidim. Teste: após chuva, muro não pode escurecer mais que 10cm da base. Documente com foto antes/depois para garantia."},{title:"Aula 3: Falhas que viram processo e como evitar",content:"80% dos processos são infiltração. Não economize membrana barata. Espessura final 1,2mm mínimo, meça com paquímetro em amostra. Cantos arredondados com meia-cana 5cm argamassa, não quina viva que rasga membrana. Proteja membrana do sol >48h sem proteção. Sobreposição de tela 10cm. Registro de aplicação com data e lote. Entregue laudo de teste de estanqueidade assinado. Cliente assina ciência de manutenção anual de rejunte e pintura. Isso blinda você juridicamente e mostra profissionalismo de mestre."}]},{id:"M14",short:"Entrega",lessons:[{title:"Aula 1: Check-list final que impressiona",content:"Check-list 32 itens: prumo fachada 2mm em 3m, esquadro cômodos 3-4-5, nível pisos, caimento ralos 1%, portas sem raspar, janelas abrindo 90°, rejunte sem falha, rodapé sem fresta, pintura sem mancha, tomadas funcionando, registro vazão. Use nível laser e trena digital, anote. Fotografe cada item com data. Entregue pasta com notas fiscais de material, sobra de piso etiquetada, chave reserva. Limpeza final: obra limpa vende indicação. Varra, aspire, passe pano úmido com detergente neutro, retire respingo tinta com espátula plástica."},{title:"Aula 2: Orçamento, valorização e como cobrar 40% a mais",content:"Amador cobra por dia, profissional por m² com escopo fechado. Calcule material + mão de obra + 15% quebra + 20% lucro + 5% garantia. Mostre gabarito, prumo, verga transpasse 30cm — cliente paga por técnica visível. Proposta com 3 opções: econômico, padrão, premium com porcelanato grande e rejunte epóxi. Contrato simples com escopo, prazo, forma pagamento 30-40-30, multa atraso. Fotos de antes/depois no Instagram com régua mostrando prumo 2mm. Isso justifica R$ 120/m² vs R$ 70 do concorrente torto."},{title:"Aula 3: Pós-obra, garantia e indicações infinitas",content:"Garantia legal 5 anos estrutural, 1 ano acabamento. Deixe termo assinado com manutenção recomendada. Visita 30 dias após entrega para retoque fino gratuito — custa 2h e gera 3 indicações. Peça vídeo depoimento na hora da entrega com cliente emocionado. Grupo WhatsApp com cliente + 2 contatos dele para suporte. Manutenção: entregue manual simples 1 página com limpeza, rejunte, infiltração. Profissional que entrega técnica + documentação + pós-obra vira referência no bairro e agenda fecha 3 meses à frente."}]}];function _i(){let[e,t]=Oc.useState("M1");return F("div",{className:"min-h-screen bg-[#0A0A0F] text-white antialiased selection:bg-[#FF6A00] selection:text-white",children:[N("style",{children:`
